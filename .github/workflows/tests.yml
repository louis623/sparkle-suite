name: Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  vitest:
    name: Full Vitest (known-failure baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # Historical release-scope tests inspect pinned commits.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run all tests (capture failures for comparison)
        id: vitest
        continue-on-error: true
        run: npx vitest run --reporter=json --outputFile=vitest-results.json
      - name: Reject new failures and suite-load errors
        if: ${{ !cancelled() && steps.vitest.outcome != 'skipped' }}
        run: npm run test:ci -- vitest-results.json
